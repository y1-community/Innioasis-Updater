name: Generate static notice pages

on:
  push:
    paths:
      - notice.xml
      - scripts/generate_notice_pages.py
      - .github/workflows/generate-notice-pages.yml
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

# sitemap.xml and the notice index are shared with the other static generators.
concurrency:
  group: site-static-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Writes the English page plus one literal copy per supported language,
      # removes pages for notices that are no longer published, and warns when a
      # page a notice links to is missing the site header/footer.
      - name: Render notice pages from notice.xml
        run: python scripts/generate_notice_pages.py
      # generate_sitemap.py reads tracked files, so the new notice pages must be
      # staged before it runs or they never reach either sitemap.
      - name: Audit sitemaps against the notice pages that now exist
        run: |
          git add -A notices
          python scripts/generate_sitemap.py
          python scripts/generate_sitemap.py --check
      - name: Commit regenerated pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notices sitemap.xml sitemap-index.xml sitemap-i18n.xml sitemap-i18n-*.xml
          if git diff --cached --quiet; then
            echo "No notice changes."
            exit 0
          fi
          git commit -m "Regenerate static notice pages from notice.xml"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "ERROR: could not push regenerated notice pages." >&2
          exit 1
