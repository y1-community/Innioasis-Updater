name: Generate release notes and post-install pages

# Every firmware release listed in slidia_manifest.xml gets a static page, old
# and new: its release notes, our portable download buttons, the Updater CE
# install guide, and the project's post-install Markdown. The pages are the
# crawlable equivalents of release_notes.html and post_install.html.
#
# The same run writes the static firmware list (firmware-list.html) and the
# machine-readable feeds in feeds/ that Updater CE falls back to when GitHub's
# API is blocked or rate limited. sitemap.xml is audited against the pages that
# actually exist, so a page no release produces any more leaves the sitemap.

on:
  push:
    paths:
      - slidia_manifest.xml
      - firmware-catalog.js
      - docs-viewer.js
      - release_notes.html
      - post_install.html
      - firmware-info.js
      - scripts/generate_backup_feeds.py
      - scripts/generate_doc_pages.py
      - scripts/generate_rockbox_pages.py
      - scripts/generate_firmware_info.py
      - scripts/generate_firmware_list.py
      - scripts/generate_install_guides.py
      - scripts/install_guides_data.py
      - install.css
      - scripts/generate_sitemap.py
      - config.ini
      - .github/workflows/generate-doc-pages.yml
  # A release published in any listed project can ask for a rebuild.
  repository_dispatch:
    types: [firmware-release]
  workflow_dispatch:
    inputs:
      refresh:
        description: "Ignore the cached GitHub responses"
        type: boolean
        default: false
  # Hourly, so a developer's new release, edited notes or README reaches the
  # generated pages on its own. Skipped runs are picked up by the next hour.
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

# The static generators write the same files (sitemap.xml, feeds, index pages).
# Sharing one concurrency group keeps doc pages, notice pages and the sitemap
# from committing over each other, which is what produced the rejected pushes.
concurrency:
  group: site-static-pages
  # Never cancel here: cancel-in-progress applies to the whole group, so a new
  # doc-pages run would kill a queued notice or sitemap run as well.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Name this day's cache
        id: doc-cache-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # One cache per day: each run restores it, and only the first run of
      # the day writes a new one. The generators treat responses older than
      # 15 minutes as stale, so an hourly run still reads fresh data.
      - name: Cache GitHub responses
        uses: actions/cache@v4
        with:
          path: .cache/doc-pages
          key: doc-pages-${{ steps.doc-cache-day.outputs.day }}
          restore-keys: doc-pages-

      - name: Generate 1:1 backup release feeds and catalogue snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_backup_feeds.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: Render release notes and post-install pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_doc_pages.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: Render the Rockbox-Y1 and Rockbox-Y2 pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_rockbox_pages.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: Render firmware README pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_firmware_info.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: Render the static firmware list and its structured data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_firmware_list.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: Render the OS-specific install guides
        run: |
          python scripts/generate_install_guides.py

      - name: Audit sitemap.xml against the pages that exist
        run: |
          python scripts/generate_sitemap.py
          python scripts/generate_sitemap.py --check

      # A package listed in slidia_manifest.xml with no feed on disk has no
      # backup: a blocked GitHub API would leave it invisible. This warns
      # rather than failing, because a repository can legitimately have no
      # releases yet.
      - name: Check every manifest repository has a backup feed
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path(".")
          repos = sorted({(pkg.get("repo") or "").strip().lower()
                          for pkg in ET.parse(root / "slidia_manifest.xml").getroot().iter("package")
                          if (pkg.get("repo") or "").strip()})
          missing = [repo for repo in repos if not (root / "feeds" / repo / "releases.json").exists()]
          for repo in missing:
              print("::warning::No backup feed for %s" % repo)
          print("%d of %d manifest repositories have a backup feed." % (len(repos) - len(missing), len(repos)))
          PY

      - name: Commit regenerated pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds firmware-catalog.js release-notes post-install firmware-info rockbox-y1 rockbox-y2 rockbox-rom-download.html rockbox-y1-themes.html firmware-list.html firmware.html install sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "No release, post-install or README changes."
            exit 0
          fi
          git commit -m "Regenerate static release notes, post-install, README and firmware list pages"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "ERROR: could not push regenerated pages." >&2
          exit 1
