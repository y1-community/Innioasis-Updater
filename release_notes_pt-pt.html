  <script>
    /* Release notes reader.

       This replaces the bare "View on GitHub" jump with a page in our own
       styling: the release's Markdown body rendered verbatim, as simple as a
       notice page. No release file listing is shown here - readers are pointed
       at our firmware directory and the "Get it in Updater CE" guided install
       instead of a table of ZIPs, APKs and other release assets.

       Reached from the firmware directory rows, from install guides, and from
       post_install.html. scripts/generate_doc_pages.py writes static versions
       of the same page for every release, old and new. */
    (function () {
      "use strict";

      /* docs-viewer.js is deferred; resolve it once the page is ready. */
      var D = null;
      var state = {};

      function el(id) { return document.getElementById(id); }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function catalogItem() {
        var catalog = window.INNIOASIS_FIRMWARE_CATALOG || [];
        if (state.software) {
          var bySlug = catalog.find(function (entry) { return entry.slug === state.software; });
          if (bySlug) return bySlug;
        }
        if (state.repo) {
          return catalog.find(function (entry) {
            return entry.repo && entry.repo.toLowerCase() === state.repo.toLowerCase() &&
              (!state.model || entry.model === state.model);
          }) || null;
        }
        return null;
      }

      function versionOf(release) {
        if (!release) return state.tag || "";
        var name = release.name || "";
        var match = name.match(/(?:^|\s)(v?\d+\.\d+(?:\.\d+)?(?:-[a-zA-Z0-9.]+)?)(?:\s|$)/);
        return match ? match[1] : (release.tag_name || state.tag || "");
      }

      /* Quiet source links: who publishes this firmware, plus numbered
         references (firmware directory/README, release notes, catalogue pull requests). */
      function setSource(release) {
        var node = el("release-source");
        if (!node) return;
        if (!state.repo) { node.hidden = true; node.innerHTML = ""; return; }
        var owner = String(state.repo).split("/")[0];
        var tag = (release && release.tag_name) || state.tag || "";
        var projectUrl = D.firmwarePageFor(state.repo) || D.firmwareInfoHref(state.repo, state.software);
        var readmeUrl = D.firmwareInfoHref(state.repo, state.software);
        var html = 'Published by the <a href="' + escapeHtml(projectUrl) + '">' +
          escapeHtml(state.repo) + '</a> project ' +
          '<a class="lumen-cite" href="' + escapeHtml(readmeUrl) + '" title="Project README">[1]</a>';
        if (tag) {
          var notesUrl = "https://innioasis.app/" + D.releaseNotesHref({
            repo: state.repo, tag: tag, model: state.model,
            software: state.software, name: state.name
          });
          html += ' <a class="lumen-cite" href="' + escapeHtml(notesUrl) +
            '" title="Release notes">[2]</a>';
        }
        html += ' <a class="lumen-cite" href="' +
          escapeHtml("https://github.com/y1-community/Innioasis-Updater/pulls?q=" +
            encodeURIComponent("is:pr author:" + owner)) +
          '" rel="noopener" title="Catalogue pull requests">[3]</a>';
        node.innerHTML = html;
        node.hidden = false;
      }

      function setMeta(release) {
        var meta = el("release-meta");
        if (!meta) return;
        var bits = [];
        if (release && release.tag_name) bits.push('<span class="lumen-release-pill">' + escapeHtml(release.tag_name) + "</span>");
        if (state.model) bits.push("<span>" + escapeHtml(state.model) + "</span>");
        if (release && release.published_at) bits.push("<span>" + escapeHtml(D.formatDate(release.published_at)) + "</span>");
        if (release && release.prerelease) bits.push('<span class="lumen-release-pill lumen-release-pill--prerelease">Preview build</span>');
        if (release && release.draft) bits.push('<span class="lumen-release-pill lumen-release-pill--prerelease">Draft</span>');
        meta.innerHTML = bits.join("");
      }

      function setActions(release) {
        var guideUrl = state.model
          ? "guide.html?model=" + encodeURIComponent(state.model) +
            (state.software ? "&software=" + encodeURIComponent(state.software) : "")
          : "guide.html";
        var updater = el("release-updater");
        if (updater) {
          updater.href = guideUrl;
          updater.hidden = false;
          updater.textContent = state.name ? "Get " + state.name + " in Updater CE" : "Get it in Updater CE";
        }
        var directory = el("release-directory");
        if (directory) {
          directory.href = state.model
            ? "firmware.html?model=" + encodeURIComponent(state.model) +
              (state.software ? "&software=" + encodeURIComponent(state.software) : "")
            : "firmware.html";
        }
      }

      /* A release may ship its own icon as updater.png/jpg/webp/svg; after
         that only the manifest/catalog icon counts. Developer avatars are
         never used: without an icon the page shows a plain cog squircle. */
      function updaterIcon(release) {
        var assets = (release && release.assets) || [];
        for (var i = 0; i < assets.length; i += 1) {
          var asset = assets[i] || {};
          if (/^updater\.(png|webp|jpe?g|svg)$/i.test(String(asset.name || "").trim()) && asset.browser_download_url) {
            return asset.browser_download_url;
          }
        }
        return "";
      }

      function setIcon(item, release) {
        var icon = el("release-icon");
        var generic = el("release-icon-generic");
        var src = updaterIcon(release) || (item && item.icon) || "";
        var showGeneric = function () {
          if (icon) { icon.hidden = true; icon.removeAttribute("src"); }
          if (generic) generic.hidden = false;
        };
        if (!src) { showGeneric(); return; }
        if (!icon) { if (generic) generic.hidden = false; return; }
        icon.onerror = showGeneric;
        icon.src = src;
        icon.alt = "";
        icon.hidden = false;
        if (generic) generic.hidden = true;
      }

      function relatedItem(html) { return '<li>' + html + "</li>"; }

      function renderRelated(release, releases) {
        var section = el("release-related");
        if (!section) return;
        var cards = [];
        var item = state.item;

        if (item && item.post_install && D.parseSource(item.post_install)) {
          var link = D.postInstallHref(item.post_install, {
            software: item.slug || state.software,
            model: item.model || state.model,
            repo: item.repo || state.repo,
            name: item.name || state.name
          });
          cards.push(relatedItem(
            '<a href="' + escapeHtml(link) + '"><strong>Post-install setup</strong>' +
            "<small>The steps to finish after this firmware is installed</small></a>"
          ));
        }
        if (item && (item.guide || item.seoPage)) {
          cards.push(relatedItem(
            '<a href="' + escapeHtml(item.guide || item.seoPage) + '"><strong>Install guide</strong>' +
            "<small>Step-by-step install for " + escapeHtml(item.name || state.name || "this firmware") + "</small></a>"
          ));
        }

        var others = (releases || []).filter(function (entry) {
          return !release || entry.id !== release.id;
        }).slice(0, 8);
        others.forEach(function (entry) {
          var href = D.releaseNotesHref({
            repo: state.repo,
            tag: entry.tag_name || "",
            model: state.model,
            software: state.software,
            name: state.name
          });
          cards.push(relatedItem(
            '<a href="' + escapeHtml(href) + '"><strong>' + escapeHtml(entry.name || entry.tag_name || "Release") + "</strong>" +
            "<small>" + escapeHtml(entry.tag_name || "") +
            (entry.published_at ? " · " + escapeHtml(D.formatDate(entry.published_at)) : "") + "</small></a>"
          ));
        });

        if (!cards.length) return;
        section.hidden = false;
        section.innerHTML = "<h2>Also useful</h2><ul class=\"lumen-doc-related-list\">" + cards.join("") + "</ul>";
      }

      function showError(message, release) {
        var body = el("release-body");
        /* Keep the reader here: a failure offers the firmware directory and a
           retry rather than a jump to the project's own release page. */
        if (body) {
          body.innerHTML =
            '<div class="lumen-doc-status lumen-doc-error"><p><strong>' + escapeHtml(message) + "</strong></p>" +
            '<p class="lumen-actions">' +
            '<button class="lumen-button lumen-button--primary" type="button" id="release-retry">Try again</button>' +
            '<a class="lumen-button" href="firmware_pt-PT.html">Back to Firmware Downloads</a></p></div>';
          var retry = el("release-retry");
          if (retry) {
            retry.addEventListener("click", function () { window.location.reload(); });
          }
        }
        setActions(release || null);
        var note = el("release-note");
        if (note) {
          note.textContent = "The notes could not be fetched just now. Try again in a moment, or open the firmware list.";
          note.hidden = false;
        }
      }

      function renderRelease(release, releases) {
        var item = state.item;
        var label = state.name || (item && item.name) || state.repo;
        var version = versionOf(release);
        var title = (release && release.name) ? release.name : (label + " " + version).trim();

        state.tag = (release && release.tag_name) || state.tag;

        var titleEl = el("release-title");
        if (titleEl) titleEl.textContent = title;
        var kicker = el("release-kicker");
        if (kicker) {
          kicker.textContent = "Firmware release notes · " + label + (state.model ? " · " + state.model : "");
        }
        var lead = el("release-lead");
        if (lead) {
          lead.textContent = (item && item.description) ||
            "What changed in this release, and how to install it.";
        }
        document.title = title + " - Innioasis Updater";

        setIcon(item, release);
        setMeta(release);
        setSource(release);
        setActions(release);
        renderRelated(release, releases);

        var body = el("release-body");
        var ctx = {};
        if (state.repo && state.tag) {
          ctx.repo = state.repo;
          ctx.ref = state.tag;
          ctx.dirBlob = "https://github.com/" + state.repo + "/blob/" + state.tag + "/";
          ctx.dirRaw = "https://raw.githubusercontent.com/" + state.repo + "/" + state.tag + "/";
        }
        /* A release with no body is not necessarily a release with no notes:
           projects often attach them as a Markdown file instead. Those are
           pulled through the GitHub API and rendered here, so reading them
           never requires leaving the site. */
        function noNotes() {
          if (!body) return;
          body.innerHTML = '<p class="lumen-doc-status">' +
            escapeHtml(release && release.name ? release.name + " has no published notes yet." : "This release has no published notes yet.") +
            ' Check <a href="firmware_pt-PT.html">Firmware Downloads</a> for the current build, '
            + "or install it with Updater CE." +
            "</p>";
        }
        if (body) {
          var published = String((release && release.body) || "").trim();
          if (published) {
            body.innerHTML = D.markdownToHtml(published, ctx);
            if (window.InnioasisLocale && typeof window.InnioasisLocale.translateDynamic === "function") {
              window.InnioasisLocale.translateDynamic(body);
            }
          } else {
            body.innerHTML = '<p class="lumen-doc-status">Loading the notes from the project…</p>';
            D.releaseNotesMarkdown(state.repo, state.tag).then(function (found) {
              if (found && found.markdown) {
                body.innerHTML = D.markdownToHtml(found.markdown, ctx);
                if (window.InnioasisLocale && typeof window.InnioasisLocale.translateDynamic === "function") {
                  window.InnioasisLocale.translateDynamic(body);
                }
              } else {
                noNotes();
              }
            }).catch(noNotes);
          }
        }

        /* This parser page is what the site links to; the generated copies
           keep their own canonical URLs for search engines. */
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical && (state.software || state.repo)) {
          canonical.href = "https://innioasis.app/release_notes.html";
        }
      }

      function pickRelease(releases) {
        if (!releases || !releases.length) return null;
        if (state.tag) {
          var wanted = state.tag.toLowerCase();
          var exact = releases.find(function (entry) {
            return String(entry.tag_name || "").toLowerCase() === wanted ||
              String(entry.name || "").toLowerCase() === wanted;
          });
          /* A specific release was asked for: never quietly show a different
             one in its place. */
          return exact || null;
        }
        var names = [];
        if (state.item) {
          names.push(String(state.item.packageName || "").toLowerCase());
          if (state.model === "Y2") names.push("rom_y2.zip");
          if (state.model === "Y1") names.push("rom.zip", "rom_type_b.zip");
        }
        var matched = releases.find(function (entry) {
          return (entry.assets || []).some(function (asset) {
            return names.indexOf(String(asset.name || "").toLowerCase()) !== -1;
          });
        });
        return matched || releases[0];
      }

      /* A visit with no project is the site's own release-notes index: the
         catalogue listed here, never a link to a generated static page. */
      function showDirectory() {
        document.title = "Firmware release notes - Innioasis Updater";
        var titleEl = el("release-title");
        if (titleEl) titleEl.textContent = "Firmware release notes";
        var kicker = el("release-kicker");
        if (kicker) kicker.textContent = "Firmware release notes";
        var lead = el("release-lead");
        if (lead) lead.textContent = "Pick a project to read the notes for its released builds.";
        var body = el("release-body");
        var action = el("release-source-placeholder");
        var source = el("release-source");
        if (source) { source.hidden = true; source.innerHTML = ""; }
        var items = (window.INNIOASIS_FIRMWARE_CATALOG || []).slice().sort(function (a, b) {
          return String(a.model || "").localeCompare(String(b.model || "")) ||
            String(a.name || "").localeCompare(String(b.name || ""));
        });
        if (!body) return;
        if (!items.length) {
          body.innerHTML = '<p class="lumen-doc-status">No software is listed yet. ' +
            'Check <a href="firmware_pt-PT.html">Firmware Downloads</a>.</p>';
          return;
        }
        body.innerHTML = '<ul class="lumen-doc-related-list">' + items.map(function (item) {
          var repoParts = String(item.repo || "").split("/");
          var query = "software=" + encodeURIComponent(item.slug || "") +
            (repoParts[0] ? "&author=" + encodeURIComponent(repoParts[0]) : "") +
            (repoParts[1] ? "&project=" + encodeURIComponent(repoParts[1]) : "");
          return '<li><a href="release_notes.html?' + query + '">' +
            '<strong>' + escapeHtml(item.name || item.slug || "") + '</strong>' +
            '<small>' + escapeHtml([item.model || "", item.description || ""].filter(Boolean).join(" · ")) +
            '</small></a></li>';
        }).join("") + '</ul>';
      }

      function load() {
        D = window.InnioasisDocs;
        if (!D) {
          var status = document.getElementById("release-status");
          if (status) {
            status.innerHTML = 'The release notes viewer could not start. ' +
              '<a href="firmware_pt-PT.html">Back to Firmware Downloads</a>';
          }
          return;
        }
        /* A link may carry the manifest's repo broken into author and project,
           with the release tag as version; take either shape. */
        state.author = D.queryParam("author");
        state.project = D.queryParam("project");
        state.version = D.queryParam("version") || D.queryParam("tag");
        state.repo = D.queryParam("repo") ||
          (state.author && state.project ? state.author + "/" + state.project : "");
        state.tag = state.version;
        state.model = D.queryParam("model").toUpperCase();
        state.software = D.queryParam("software");
        state.name = D.queryParam("name");
        state.item = catalogItem();
        if (!state.name && state.item) state.name = state.item.name || "";
        if (!state.name) state.name = state.project || "";

        if (!state.repo && state.item) state.repo = state.item.repo || "";
        if (!state.model && state.item) state.model = state.item.model || "";
        if (!state.name && state.item) state.name = state.item.name || "";
        if (!state.software && state.item) state.software = state.item.slug || "";

        /* Show the manifest icon, or the cog squircle, while the release is
           loading and when it cannot be fetched at all. */
        setIcon(state.item, null);

        var back = el("release-back");
        if (back) {
          back.innerHTML = '<a href="' + escapeHtml(state.model
            ? "firmware.html?model=" + encodeURIComponent(state.model) +
              (state.software ? "&software=" + encodeURIComponent(state.software) : "")
            : "firmware.html") + '">← Firmware Downloads</a>';
        }

        if (!state.repo) {
          showDirectory();
          return;
        }

        loadLive();
      }

      function loadLive() {
        /* A tag lookup can fail on a rename or a rate-limited API; fall back
           to the release list and match there before giving up. */
        var releasesRequest = state.tag
          ? D.fetchRelease(state.repo, state.tag).then(function (release) { return [release]; })
              .catch(function () { return D.fetchReleases(state.repo, 1); })
          : D.fetchReleases(state.repo, 1);

        Promise.all([
          releasesRequest,
          state.tag ? Promise.resolve([]) : D.fetchReleases(state.repo, 1)
        ]).then(function (results) {
          var releases = results[0] || [];
          var release = pickRelease(releases);
          if (!release) {
            showError("This project has no public releases yet.");
            return;
          }
          /* With no tag in the URL this page is the project's latest release,
             and renderRelease records the tag it actually resolved. */
          renderRelease(release, releases);
        }).catch(function (error) {
          if (window.console && console.warn) console.warn("release notes failed", error);
          showError("The release notes for this version could not be loaded.");
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", load);
      } else {
        load();
      }
    })();
  </script>
