  <script src="nav.js?v=20261124fixes1" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var listEl = document.getElementById("notices-list");
      if (!listEl) return;

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function markdownToHtml(source) {
        if (typeof window.y1NoticeMarkdown === "function") return window.y1NoticeMarkdown(source);
        return "<p>" + escapeHtml(source).replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
      }
      function detailHref(id) { return "notices/" + encodeURIComponent(id) + ".html"; }
      function isBareSiteUrl(raw) {
        if (typeof window.y1NoticeIsBareUrl === "function") return window.y1NoticeIsBareUrl(raw);
        if (!raw) return true;
        try {
          var url = new URL(raw, window.location.href);
          return !url.pathname.replace(/\//g, "") && !url.search && !url.hash;
        } catch (_) { return true; }
      }
      function textOf(node, tag) {
        var el = node.querySelector(tag);
        return el && el.textContent ? el.textContent.trim() : "";
      }
      function todayIso() {
        var now = new Date();
        var pad = function (n) { return (n < 10 ? "0" : "") + n; };
        return now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
      }
      function isNoticeActive(notice, today) {
        if (typeof window.y1NoticeIsActive === "function") return window.y1NoticeIsActive(notice, today);
        var day = today || todayIso();
        if (notice.from && String(notice.from).slice(0, 10) > day) return false;
        if (notice.until && String(notice.until).slice(0, 10) < day) return false;
        return true;
      }
      function parseFeed(xmlText) {
        var doc = new DOMParser().parseFromString(xmlText, "application/xml");
        if (doc.querySelector("parsererror")) return [];
        var out = [];
        doc.querySelectorAll("notice").forEach(function (n) {
          var id = n.getAttribute("id") || "";
          if (!id) return;
          var from = n.getAttribute("from") || n.getAttribute("date") || "";
          var until = n.getAttribute("until") || "";
          out.push({
            id: id,
            type: n.getAttribute("type") || n.getAttribute("severity") || "info",
            from: from.slice(0, 10),
            until: until.slice(0, 10),
            models: n.getAttribute("models") || "",
            deviceType: n.getAttribute("device_type") || "",
            firmwareRepo: n.getAttribute("firmware_repo") || "",
            firmwareVersion: n.getAttribute("firmware_version") || "",
            title: textOf(n, "title"),
            summary: textOf(n, "content") || textOf(n, "body") || textOf(n, "summary"),
            full: textOf(n, "full_content") || textOf(n, "content") || textOf(n, "body"),
            url: textOf(n, "url") || textOf(n, "link")
          });
        });
        return out;
      }
      function modelsLabel(models) {
        var raw = (models || "").trim();
        if (!raw || /^(all|all\s+models|\*)$/i.test(raw)) return "";
        return raw;
      }
      function normaliseRepo(repo) {
        var text = String(repo || "").trim().replace(/^https?:\/\/(www\.)?github\.com\//i, "");
        text = text.replace(/\/$/, "");
        if (/\.git$/i.test(text)) text = text.slice(0, -4);
        return text.toLowerCase();
      }
      function repoMatches(targets, repo) {
        var wanted = normaliseRepo(repo);
        if (!wanted) return false;
        return String(targets || "").split(",").some(function (part) {
          var pattern = normaliseRepo(part);
          if (!pattern) return false;
          var escaped = pattern.replace(/[.+^${}()|[\]\\]/g, "\\$&");
          return new RegExp("^" + escaped.replace(/\*/g, ".*") + "$").test(wanted);
        });
      }
      function versionMatches(patterns, version) {
        var tag = String(version || "").trim().toLowerCase();
        var parts = String(patterns || "").split(",").map(function (part) {
          return part.trim().toLowerCase();
        }).filter(Boolean);
        if (!tag) return parts.indexOf("*") !== -1;
        var candidates = [tag, tag.replace(/^v/, "")];
        return parts.some(function (pattern) {
          var escaped = pattern.replace(/[.+^${}()|[\]\\]/g, "\\$&");
          var re = new RegExp("^" + escaped.replace(/\*/g, ".*") + "$");
          return candidates.some(function (candidate) {
            return re.test(candidate) || (pattern.charAt(0) === "v" && re.test(candidate.replace(/^v/, "")));
          });
        });
      }
      function contextScore(notice, context) {
        if (!context) return 0;
        var models = String(notice.models || "").split(",").map(function (m) { return m.trim().toUpperCase(); }).filter(Boolean);
        if (models.length && context.model && models.indexOf(context.model.toUpperCase()) === -1) return -1;
        var types = String(notice.deviceType || "").split(",").map(function (t) { return t.trim().toUpperCase(); }).filter(Boolean);
        if (types.length) {
          if (context.deviceType) {
            if (types.indexOf(context.deviceType.toUpperCase()) === -1) return -1;
          } else if (!models.length || !(/^Y1$/i.test(context.model || ""))) {
            return -1;
          }
        }
        if (String(notice.firmwareRepo || "").trim()) {
          if (!repoMatches(notice.firmwareRepo, context.firmwareRepo)) return -1;
        }
        if (String(notice.firmwareVersion || "").trim()) {
          if (!versionMatches(notice.firmwareVersion, context.firmwareVersion)) return -1;
        }
        var score = 0;
        if (String(notice.firmwareRepo || "").trim()) score += 8;
        if (String(notice.firmwareVersion || "").trim()) score += 4;
        if (types.length) score += 2;
        if (models.length) score += 1;
        return score;
      }
      function pageContext() {
        var params;
        try { params = new URLSearchParams(window.location.search); } catch (_) { return null; }
        var context = {
          model: params.get("model") || "",
          deviceType: params.get("type") || params.get("device_type") || "",
          firmwareRepo: params.get("repo") || params.get("firmware_repo") || "",
          firmwareVersion: params.get("version") || params.get("firmware_version") || ""
        };
        return (context.model || context.deviceType || context.firmwareRepo || context.firmwareVersion) ? context : null;
      }
      function orderForContext(notices) {
        var context = pageContext();
        if (!context) return { notices: notices, context: null };
        var scored = notices.map(function (notice, index) {
          return { notice: notice, index: index, score: contextScore(notice, context) };
        });
        // Everyone's notices stay in the list; matching targeted ones lead it.
        scored.sort(function (a, b) {
          if (b.score !== a.score) return b.score - a.score;
          return a.index - b.index;
        });
        return {
          notices: scored.map(function (row) { return row.notice; }),
          context: context
        };
      }
      function metaLine(notice) {
        var bits = [String(notice.type || "info").toUpperCase()];
        if (notice.from) bits.push(notice.from);
        var models = modelsLabel(notice.models);
        if (models) bits.push(models);
        var types = (notice.deviceType || "").trim();
        if (types) bits.push("Type " + types.toUpperCase());
        var repo = (notice.firmwareRepo || "").trim();
        if (repo) bits.push(repo);
        var version = (notice.firmwareVersion || "").trim();
        if (version) bits.push(version === "*" ? "all releases" : version);
        return bits.join(" · ");
      }
      function renderList(notices, message) {
        var html = message ? '<p class="lumen-meta">' + escapeHtml(message) + "</p>" : "";
        html += '<div class="lumen-grid">';
        notices.forEach(function (notice) {
          html += '<article class="lumen-card">' +
            "<small>" + escapeHtml(metaLine(notice)) + "</small>" +
            "<h3>" + escapeHtml(notice.title) + "</h3>" +
            "<p>" + escapeHtml(notice.summary) + "</p>" +
            '<div class="lumen-actions"><a class="lumen-button" href="' + escapeHtml(detailHref(notice.id)) + '">Read more</a></div>' +
            "</article>";
        });
        html += "</div>";
        listEl.innerHTML = html;
      }
      function renderNotice(notice) {
        document.title = notice.title + " - Innioasis Notices";
        var pageLink = isBareSiteUrl(notice.url)
          ? ""
          : '<div class="lumen-actions"><a class="lumen-button lumen-button--primary" href="' + escapeHtml(notice.url) + '" rel="noopener">Open the linked page</a></div>';
        listEl.innerHTML =
          '<p class="lumen-notice-back"><a href="notices_pl.html">← All notices</a></p>' +
          '<article class="lumen-notice-view">' +
          '<p class="lumen-kicker">' + escapeHtml(metaLine(notice)) + "</p>" +
          "<h1>" + escapeHtml(notice.title) + "</h1>" +
          (notice.summary && notice.summary !== notice.full ? '<p class="lead">' + escapeHtml(notice.summary) + "</p>" : "") +
          '<div class="lumen-notice-body">' + markdownToHtml(notice.full) + "</div>" +
          pageLink +
          "</article>";
        if (listEl) {
          /* Put the start of the notice at the top of the viewport instead of
             leaving the reader on the page header buttons. Computed by hand
             because scrollIntoView misbehaves when late layout shifts the page. */
          var jumpToNotice = function () {
            var start = listEl.querySelector(".lumen-notice-view");
            if (!start) return;
            var top = start.getBoundingClientRect().top + (window.pageYOffset || 0) - 92;
            window.scrollTo(0, top > 0 ? top : 0);
          };
          requestAnimationFrame(jumpToNotice);
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(jumpToNotice).catch(function () {});
          }
        }
      }
      function wantedId() {
        try {
          var id = new URLSearchParams(window.location.search).get("notice");
          if (id) return id;
        } catch (_) {}
        var hash = (window.location.hash || "").replace(/^#/, "");
        return hash.indexOf("notice-") === 0 ? hash.slice(7) : "";
      }
      var candidates = ["https://raw.githubusercontent.com/y1-community/Innioasis-Updater/main/notice.xml", "notice.xml", "/notice.xml", "https://innioasis.app/notice.xml"];
      function load(index) {
        if (index >= candidates.length) {
          listEl.innerHTML = "<p>Could not load notices feed.</p>";
          return;
        }
        fetch(candidates[index], { cache: "no-cache" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then(function (xmlText) {
            var notices = parseFeed(xmlText);
            if (!notices.length) throw new Error("empty feed");
            var activeNotices = notices.filter(function (n) { return isNoticeActive(n); });
            var wanted = wantedId();
            if (wanted) {
              var found = activeNotices.filter(function (n) { return n.id === wanted; })[0]
                || notices.filter(function (n) { return n.id === wanted; })[0];
              if (found) { renderNotice(found); return; }
              if (!activeNotices.length) {
                listEl.innerHTML = "<p>That notice is no longer published, and there are no active notices at this time.</p>";
                return;
              }
              renderList(activeNotices, "That notice is no longer published. Here is everything that is current.");
              return;
            }
            if (!activeNotices.length) {
              listEl.innerHTML = "<p>No active notices at this time.</p>";
              return;
            }
            var ordered = orderForContext(activeNotices);
            var message = "";
            if (ordered.context) {
              var label = ordered.context.firmwareRepo || ordered.context.model || "this firmware";
              message = "Notices about " + label + " are listed first; notices for everyone are below them.";
            }
            renderList(ordered.notices, message);
          })
          .catch(function () { load(index + 1); });
      }
      load(0);
    });
  </script>
